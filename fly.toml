# Fly.io: API with embedded worker. See docs/deploy.md.
app = "jobgraph-api-norinote"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  EMBED_WORKER = "1"
  NODE_ENV = "production"
  API_PORT = "4000"
  ARTIFACTS_DIR = "/data/artifacts"
  # Live sending: an approved application is really submitted to the employer. Every send still needs the person's approval.
  # Set to "false" (or `flyctl secrets set ALLOW_REAL_SUBMIT=false`) to go back to dry run, where forms are filled and nothing is sent.
  ALLOW_REAL_SUBMIT = "true"

[mounts]
  source = "jobgraph_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 4000
  force_https = true
  # The scheduler, agent tick and channel listeners live in this process: never stop it, always keep one machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"

[[vm]]
  # Dedicated CPUs: shared ones are throttled once their burst credit is spent, which made resume rendering and form filling crawl.
  size = "performance-2x"
  memory = "4gb"
