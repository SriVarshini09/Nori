<!doctype html>
<meta charset="utf-8">
<title>Nori logo sheet</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f3efe8; color: #141311; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; padding: 28px; align-items: center; }
  .card { border-radius: 24px; padding: 28px; display: flex; align-items: center; gap: 28px; }
  .light { background: #fff; } .cream { background: #f3efe8; border: 1px solid #ddd6c8; }
  .dark { background: linear-gradient(135deg, #052e2c, #0a4a43 45%, #22226b); }
  .aurora { background: #0a1b15; }
  h2 { margin: 24px 28px 0; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: #6f6a60; }
  img { display: block; }
  .tab { background: #dee1e6; border-radius: 10px 10px 0 0; padding: 8px 14px; display: flex; gap: 8px; align-items: center; font-size: 12px; width: 190px; }
  .tabd { background: #35363a; color: #e8eaed; border-radius: 10px 10px 0 0; padding: 8px 14px; display: flex; gap: 8px; align-items: center; font-size: 12px; width: 190px; }
</style>
<h2>Lockup</h2>
<div class="row">
  <div class="card light"><img src="nori-logo.svg" height="90"></div>
  <div class="card cream"><img src="nori-logo.svg" height="60"></div>
  <div class="card cream"><img src="nori-logo.svg" height="34"></div>
</div>
<h2>Mark and app icon</h2>
<div class="row">
  <div class="card light"><img src="nori-mark.svg" width="128" height="128"><img src="nori-mark.svg" width="64" height="64"><img src="nori-mark.svg" width="32" height="32"><img src="nori-mark.svg" width="16" height="16"></div>
  <div class="card cream"><img src="nori-icon.svg" width="128" height="128"><img src="nori-icon.svg" width="64" height="64"><img src="nori-icon.svg" width="32" height="32"><img src="nori-icon.svg" width="16" height="16"></div>
  <div class="card dark"><img src="nori-mark.svg" width="128" height="128"><img src="nori-icon.svg" width="64" height="64"></div>
</div>
<h2>Favicon (simplified) and reversed lockup</h2>
<div class="row">
  <div class="card cream"><img src="nori-favicon.svg" width="96" height="96"><img src="nori-favicon.svg" width="48" height="48"><img src="nori-favicon.svg" width="32" height="32"><img src="nori-favicon.svg" width="16" height="16"></div>
  <div class="card dark"><img src="nori-logo-light.svg" height="70"></div>
</div>
<h2>Browser tabs</h2>
<div class="row">
  <div class="tab"><img src="nori-favicon.svg" width="16" height="16"> Dashboard - Nori</div>
  <div class="tabd"><img src="nori-favicon.svg" width="16" height="16"> Dashboard - Nori</div>
</div>
